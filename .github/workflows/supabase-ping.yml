name: Supabase Keep-Alive Ping

on:
  schedule:
    - cron: '0 8 */4 * *' # S'exécute automatiquement tous les 4 jours à 8h00 UTC
  workflow_dispatch: # Permet aussi de le lancer manuellement en 1 clic si tu veux tester

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Ping Database
        env:
          SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);
            async function ping() {
              const { data, error } = await supabase.from('movies').select('id').limit(1);
              if (error) {
                console.error('Erreur lors du ping Supabase:', error);
                process.exit(1);
              }
              console.log('Ping Supabase réussi ! Données lues:', data);
            }
            ping();
          "